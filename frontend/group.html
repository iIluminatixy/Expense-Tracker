<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Detail — SplitWise</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-wrapper">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="navbar-brand">
        <div class="brand-icon">💳</div>
        SplitWise
      </a>
      <div class="navbar-nav">
        <a href="profile.html" class="navbar-user-link" title="My Profile & Settings">
          <div id="nav-avatar-container">
            <div class="user-avatar" id="nav-avatar">U</div>
          </div>
          <span class="user-name" id="nav-username">User</span>
        </a>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container" id="group-content">
      <!-- Back link -->
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

      <!-- Group Header -->
      <div class="page-header" style="margin-top:0.5rem">
        <div>
          <h1 class="page-title" id="group-title">
            <span class="loading-spinner" style="width:20px;height:20px;border-width:2px;display:inline-block"></span>
          </h1>
          <p class="page-subtitle" id="group-desc"></p>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center">
          <!-- Export Dropdown -->
          <div class="export-dropdown">
            <button class="btn btn-secondary" id="export-dropdown-btn" onclick="toggleExportMenu(event)">
              ⬇ Export ▾
            </button>
            <div class="dropdown-menu" id="export-menu">
              <a class="dropdown-item" href="javascript:void(0)" onclick="exportGroupCSV()">
                <span>📊</span> Export as CSV
              </a>
              <a class="dropdown-item" href="javascript:void(0)" onclick="exportGroupPDF()">
                <span>📄</span> Export as PDF
              </a>
            </div>
          </div>
          <a href="#" id="settlement-btn" class="btn btn-secondary">
            ⚖️ Settlements
          </a>
          <a href="#" id="add-expense-btn" class="btn btn-primary">
            + Add Expense
          </a>
        </div>
      </div>

      <!-- Members Section -->
      <div class="section">
        <div class="section-header">
          <h3 class="section-title">Members</h3>
          <button class="btn btn-sm btn-secondary" onclick="openModal('add-member-modal')">
            + Add Member
          </button>
        </div>
        <div class="member-chips" id="members-container">
          <div class="loading-spinner" style="width:20px;height:20px;border-width:2px"></div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Expenses Section -->
      <div class="section">
        <div class="section-header">
          <h3 class="section-title">Expenses</h3>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div id="expenses-container">
            <div class="loading-overlay">
              <div class="loading-spinner" style="width:28px;height:28px;border-width:2.5px"></div>
              <span>Loading expenses…</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Member Modal -->
  <div class="modal-overlay" id="add-member-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Member</h3>
        <button class="modal-close" onclick="closeModal('add-member-modal')">×</button>
      </div>
      <div class="modal-body">
        <div id="add-member-alert" style="display:none"></div>
        <form id="add-member-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="member-username">Username</label>
            <input
              type="text"
              id="member-username"
              class="form-control"
              placeholder="Enter username to add"
              required
            />
            <div class="form-hint">The user must already have a SplitWise account.</div>
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem">
            <button type="button" class="btn btn-secondary" onclick="closeModal('add-member-modal')">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Add Member</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });
    });
  </script>

  <script src="js/api.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
